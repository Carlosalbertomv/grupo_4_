<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto | Mi Sitio Web</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background:#f4f4f4; color:#333; }
  header { background:#2c3e50; padding:20px; text-align:center; }
  header h1 { color:#fff; }
  nav { background:#34495e; display:flex; justify-content:center; }
  nav a { color:#fff; padding:15px 20px; text-decoration:none; }
  nav a:hover { background:#1abc9c; }
  main { max-width:800px; margin:40px auto; background:#fff; padding:30px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
  form { display:flex; flex-direction:column; gap:12px; margin-top:15px; }
  input, textarea { padding:10px; border:1px solid #ccc; border-radius:4px; font-family:inherit; }
  button { background:#1abc9c; color:#fff; border:none; padding:12px; border-radius:4px; cursor:pointer; font-size:16px; }
  button:hover { background:#16a085; }
  footer { text-align:center; padding:20px; color:#777; }
</style>
</head>
<body>

<header>
  <h1>Bienvenido a Mi Sitio Web</h1>
</header>

<nav>
  <a href="index.html">Inicio</a>
  <a href="nosotros.html">Nosotros</a>

<main>
  <h2>Contáctanos</h2>
  <p>¿Tienes alguna pregunta? Escríbenos usando el siguiente formulario.</p>
  <form>
    <input type="text" placeholder="Tu nombre" required>
    <input type="email" placeholder="Tu correo electrónico" required>
    <textarea rows="5" placeholder="Tu mensaje" required></textarea>
    <button type="submit">Enviar mensaje</button>
  </form>
</main>
